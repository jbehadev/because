# Builds `cuz` for Apple Silicon Macs, runs the tests there, and uploads the
# binary as a workflow artifact (Actions → this run → Artifacts).
name: macOS (Apple Silicon)

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGET: aarch64-apple-darwin
  # macOS 11 is the oldest release that runs on Apple Silicon. Applies to rustc
  # and to the SQLite that rusqlite compiles from source (the `bundled` feature).
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build and test (aarch64-apple-darwin)
    # An arm64 runner, so the tests run natively on Apple Silicon.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
          rustc --version --verbose

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Test
        run: cargo test --workspace --locked --target "$TARGET"

      - name: Check the binary
        run: |
          bin="target/$TARGET/release/cuz"
          file "$bin"
          test "$(lipo -archs "$bin")" = arm64
          otool -l "$bin" | grep -A4 LC_BUILD_VERSION
          # Renders the sample fixture to stdout; needs no terminal or agent.
          "$bin" render > /dev/null

      - name: Package
        # A tarball keeps the executable bit, which a zipped artifact drops.
        run: tar -czf "cuz-$TARGET.tar.gz" -C "target/$TARGET/release" cuz

      - uses: actions/upload-artifact@v7
        with:
          # Uploaded as-is, not zipped: the artifact is cuz-aarch64-apple-darwin.tar.gz.
          path: cuz-${{ env.TARGET }}.tar.gz
          archive: false
          if-no-files-found: error
